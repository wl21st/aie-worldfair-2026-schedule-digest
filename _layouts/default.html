<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Apply the saved/system theme before the stylesheet paints to avoid a flash. -->
  <script>
    (function () {
      try {
        var savedTheme = window.localStorage.getItem('aie-theme');
        var hasSavedTheme = savedTheme === 'light' || savedTheme === 'dark';
        var systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = hasSavedTheme ? savedTheme : systemTheme;
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    }());
  </script>

  <!-- Google Fonts: Source Sans 3 & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="top-gradient-border"></div>

  <header class="site-header">
    <div class="header-container">
      <a href="{{ '/' | relative_url }}" class="brand-logo">
        <span class="logo-icon">⚡</span>
        <span class="brand-title">AIEngineer World Fair 2026</span>
      </a>
      <div class="header-actions">
        <nav class="nav-links">
          <a href="{{ '/' | relative_url }}" class="nav-item">Home</a>
          <a href="{{ '/ai-engineer-worlds-fair-2026-master.html' | relative_url }}" class="nav-item">Top 30 Digest</a>
          <a href="{{ '/ai-engineer-worlds-fair-2026-sessions.html' | relative_url }}" class="nav-item">All Sessions</a>
          <a href="{{ '/keynotes.html' | relative_url }}" class="nav-item">Keynotes</a>
          <a href="{{ '/ai-engineer-worlds-fair-2026-speakers.html' | relative_url }}" class="nav-item">Speakers</a>
          <a href="{{ '/digest/embedding-investigation-report.html' | relative_url }}" class="nav-item">Embeddings</a>
          <a href="{{ '/AGENTS.html' | relative_url }}" class="nav-item">AGENTS</a>
        </nav>
        <button class="theme-toggle" type="button" data-theme-toggle hidden aria-pressed="false" aria-label="Switch to light mode">
          <span class="theme-toggle-icon" aria-hidden="true">☀</span>
          <span class="theme-toggle-label">Light mode</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-content">
    <div class="content-container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>AI Engineer World's Fair 2026 Schedule Digest Portal</p>
      <div class="footer-links">
        <a href="https://github.com/wl21st/aie-worldfair-2026-schedule-digest" target="_blank" rel="noopener">GitHub Repository</a>
        <span>•</span>
        <a href="https://pages.github.com" target="_blank" rel="noopener">Hosted on GitHub Pages</a>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>
</body>
</html>
